name: Daily tennis model

on:
  workflow_dispatch:
    inputs:
      training_start_year:
        description: Training start year
        required: false
        default: "2019"
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run date
        id: run-date
        run: |
          RUN_DATE="$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/New_York')).date().isoformat())")"
          echo "date=${RUN_DATE}" >> "$GITHUB_OUTPUT"

      - name: Fetch Hermes match database (optional)
        continue-on-error: true
        env:
          HERMES_DB_URL: ${{ secrets.HERMES_DB_URL }}
        run: |
          if [ -n "$HERMES_DB_URL" ]; then
            mkdir -p data
            curl -fsSL "$HERMES_DB_URL" -o data/tennis_matches.sqlite
            echo "Downloaded Hermes DB to data/tennis_matches.sqlite"
          else
            echo "HERMES_DB_URL not set; skipping Hermes DB download"
          fi

      - name: Refresh ATP match data (Sackmann + agent supplement)
        continue-on-error: true
        run: python scripts/refresh_match_data.py

      - name: Train daily model
        env:
          TRAINING_START_YEAR: ${{ github.event.inputs.training_start_year || '2019' }}
        run: |
          python daily_update.py \
            --date "${{ steps.run-date.outputs.date }}" \
            --db-path data/live/tennis_live.db \
            --no-kalshi \
            --retrain \
            --training-start-year "$TRAINING_START_YEAR"

      - name: Package model artifact
        run: |
          tar -czf daily-model-latest.tar.gz -C models/daily "${{ steps.run-date.outputs.date }}"
          ls -lh daily-model-latest.tar.gz

      - name: Publish latest model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view daily-model-latest >/dev/null 2>&1 || \
            gh release create daily-model-latest \
              --title "Latest daily tennis model" \
              --notes "Updated by the Daily tennis model workflow."
          gh release upload daily-model-latest daily-model-latest.tar.gz --clobber
