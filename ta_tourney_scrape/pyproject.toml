[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-tourney-scrape"
version = "1.0.0"
description = "Scrape TennisAbstract tournament pages and reconcile with base match dataset"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Tennis ML Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "requests-cache>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "lxml>=4.9.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.0",
    "pyarrow>=14.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
ta-tourney-scrape = "ta_tourney_scrape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

